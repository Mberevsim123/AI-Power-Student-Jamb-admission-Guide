services:
  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://jamb:jamb_dev@postgres:5432/jamb_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    # Local stack: apply migrations and load the university directory, then serve.
    command:
      - sh
      - -c
      - python -m scripts.release && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jamb
      POSTGRES_PASSWORD: jamb_dev
      POSTGRES_DB: jamb_db
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamb -d jamb_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  postgres_data:
  qdrant_data:
